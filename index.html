<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>To-Do List</h1>
      </header>

      <form id="todo-form" class="todo-form" autocomplete="off">
        <input
          id="todo-input"
          type="text"
          placeholder="Add a new task..."
          aria-label="Add a new task"
          maxlength="200"
        />
        <button type="submit" class="primary-btn">Add</button>
      </form>

      <section class="toolbar" aria-label="Task controls">
        <div class="filters" role="tablist" aria-label="Filter tasks">
          <button class="filter-btn active" type="button" data-filter="all">All</button>
          <button class="filter-btn" type="button" data-filter="active">Active</button>
          <button class="filter-btn" type="button" data-filter="completed">Completed</button>
        </div>
        <button id="clear-completed" type="button" class="secondary-btn">
          Clear completed
        </button>
      </section>

      <p id="task-summary" class="task-summary" aria-live="polite">0 tasks</p>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
    </main>

    <script src="script.js"></script>
  </body>
</html>
